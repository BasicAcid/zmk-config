# Explicitly enable USB and BLE/split support.
# These used to be auto-selected by board/shield defaults, but a Zephyr 4.1-era
# regression on zmk main stopped auto-enabling them for split boards, producing
# an undersized firmware with no USB HID interface and no BLE stack at all
# (silent over both USB and Bluetooth). See zmkfirmware/zmk#3234.
CONFIG_ZMK_USB=y
CONFIG_ZMK_BLE=y
CONFIG_ZMK_SPLIT_BLE=y

# CONFIG_ZMK_BLE is supposed to also pull in bond persistence (BT_SETTINGS,
# backed by SETTINGS) via a Kconfig "implies", not a hard "select". If the
# same auto-enable regression above also broke that weaker chain, bonds would
# never actually persist to flash - which the BLE stack can react to by
# cancelling the pairing right after the connection opens, with no passkey
# prompt ever shown. Setting these explicitly rules that out.
CONFIG_SETTINGS=y
CONFIG_BT_SETTINGS=y

# btmon capture shows pairing runs the full LE Secure Connections exchange
# (Pairing Request/Response, Public Key both ways, Confirm, Random) then goes
# silent - no DHKey Check ever appears - followed by a link-layer Connection
# Timeout a few seconds later. That's consistent with the peripheral's ECDH
# computation being too slow relative to the negotiated PHY/connection
# parameters. ZMK's own docs document CONFIG_BT_CTLR_PHY_2M=n as a fix for
# pairing issues on Intel Bluetooth chips specifically - this host's
# controller is an Intel AX211, an exact match.
CONFIG_BT_CTLR_PHY_2M=n

# Uncomment the following lines to enable the Corne RGB Underglow
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_WS2812_STRIP=y

# Uncomment the following line to enable the Corne OLED Display
# CONFIG_ZMK_DISPLAY=y
