# Explicitly enable USB and BLE/split support.
# These used to be auto-selected by board/shield defaults, but a Zephyr 4.1-era
# regression on zmk main stopped auto-enabling them for split boards, producing
# an undersized firmware with no USB HID interface and no BLE stack at all
# (silent over both USB and Bluetooth). See zmkfirmware/zmk#3234.
CONFIG_ZMK_USB=y
CONFIG_ZMK_BLE=y
CONFIG_ZMK_SPLIT_BLE=y

# Uncomment the following lines to enable the Corne RGB Underglow
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_WS2812_STRIP=y

# Uncomment the following line to enable the Corne OLED Display
# CONFIG_ZMK_DISPLAY=y
