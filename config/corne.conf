# Explicitly enable USB and BLE/split support.
# These used to be auto-selected by board/shield defaults, but a Zephyr 4.1-era
# regression on zmk main stopped auto-enabling them for split boards, producing
# an undersized firmware with no USB HID interface and no BLE stack at all
# (silent over both USB and Bluetooth). See zmkfirmware/zmk#3234.
CONFIG_ZMK_USB=y
CONFIG_ZMK_BLE=y
CONFIG_ZMK_SPLIT_BLE=y

# Bond persistence. CONFIG_ZMK_BLE only pulls these in via a Kconfig
# "implies" rather than a hard "select", so they are set explicitly here
# given the auto-enable regression above. Not the cause of any bug we hit -
# kept because explicit beats relying on a weak implies.
CONFIG_SETTINGS=y
CONFIG_BT_SETTINGS=y

# Fixes BLE pairing hanging forever against Intel Bluetooth controllers
# (verified against an Intel AX211). A btmon capture showed the link
# switching to 2M PHY mid-handshake, immediately after SMP Pairing Random;
# the DHKey Check that should follow never arrives and the connection dies
# of supervision timeout, which BlueZ reports as a bare
# "AuthenticationCanceled" with no passkey prompt. Staying on 1M PHY avoids
# the mid-handshake switch. Costs nothing at keyboard data rates.
CONFIG_BT_CTLR_PHY_2M=n

# Uncomment the following lines to enable the Corne RGB Underglow
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_WS2812_STRIP=y

# Uncomment the following line to enable the Corne OLED Display
# CONFIG_ZMK_DISPLAY=y
